name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows executable
        shell: pwsh
        run: |
          dotnet publish ./MxThumbWheelReader.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=none `
            --output ./dist/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package one download
        shell: pwsh
        run: |
          $publish = Join-Path $PWD 'dist/publish'
          $exe = Join-Path $publish 'MxThumbWheelReader.exe'
          $settings = Join-Path $publish 'appsettings.json'
          foreach ($file in @($exe, $settings)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Chybí soubor pro release: $file"
            }
          }
          $asset = Join-Path $PWD "dist/MxThumbWheelReader-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -LiteralPath @($exe, $settings, (Join-Path $PWD 'README.md')) -DestinationPath $asset
          "RELEASE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ASSET `
            --verify-tag `
            --generate-notes `
            --title $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
